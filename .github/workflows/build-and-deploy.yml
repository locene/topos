name: Build and Deploy

on:
  push:
    branches: [main]

  workflow_dispatch:

env:
  DEPLOY_DIR_BACKEND: /var/deploy/locene/topos-backend
  DEPLOY_DIR_WEBAPP: /var/deploy/locene/topos-webapp

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          ref: main

      - name: Set up rust
        uses: actions-rust-lang/setup-rust-toolchain@main
        with:
          toolchain: stable
          cache: true

      - name: Build app
        run: |
          cd backend
          echo "${{ secrets.ENV_FILE }}" > .env
          cargo build --release

      - name: Build image
        run: |
          cd backend
          docker build --force-rm -t locene/topos-backend:latest -f deploy/Dockerfile .
          docker save locene/topos-backend > locene-topos-backend.tar
          docker image prune -f

      - name: Copy image
        uses: appleboy/scp-action@master
        with:
          host: ${{secrets.SERVER_HOST}}
          username: ${{secrets.SERVER_USER}}
          password: ${{secrets.SERVER_PASS}}
          source: "backend/locene-topos-backend.tar, backend/deploy/docker-compose.yml"
          target: ${{env.DEPLOY_DIR_BACKEND}}-${{github.run_id}}
          strip_components: 1

  build-webapp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          ref: main

      - name: Set up rust
        uses: actions-rust-lang/setup-rust-toolchain@main
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          cache: true

      - name: Build app
        run: |
          cd webapp
          cargo install trunk
          trunk build --release

      - name: Build image
        run: |
          cd webapp
          docker build --force-rm -t locene/topos-webapp:latest -f deploy/Dockerfile .
          docker save locene/topos-webapp > locene-topos-webapp.tar
          docker image prune -f

      - name: Copy image
        uses: appleboy/scp-action@master
        with:
          host: ${{secrets.SERVER_HOST}}
          username: ${{secrets.SERVER_USER}}
          password: ${{secrets.SERVER_PASS}}
          source: "webapp/locene-topos-webapp.tar, webapp/deploy/docker-compose.yml"
          target: ${{env.DEPLOY_DIR_WEBAPP}}-${{github.run_id}}
          strip_components: 1

  deploy-backend:
    needs: [build-backend, build-webapp]
    runs-on: ubuntu-latest

    steps:
      - name: Finalize settings
        uses: appleboy/ssh-action@master
        with:
          host: ${{secrets.SERVER_HOST}}
          username: ${{secrets.SERVER_USER}}
          password: ${{secrets.SERVER_PASS}}
          script: |
            docker load < ${{env.DEPLOY_DIR_BACKEND}}-${{github.run_id}}/locene-topos-backend.tar
            mkdir -p ${{env.DEPLOY_DIR_BACKEND}}
            mv -f ${{env.DEPLOY_DIR_BACKEND}}-${{github.run_id}}/deploy/docker-compose.yml ${{env.DEPLOY_DIR_BACKEND}}/docker-compose.yml
            rm -rf ${{env.DEPLOY_DIR_BACKEND}}-${{github.run_id}}
            cd ${{env.DEPLOY_DIR_BACKEND}}
            docker compose down
            docker compose up -d

  deploy-webapp:
    needs: [build-backend, build-webapp]
    runs-on: ubuntu-latest

    steps:
      - name: Finalize settings
        uses: appleboy/ssh-action@master
        with:
          host: ${{secrets.SERVER_HOST}}
          username: ${{secrets.SERVER_USER}}
          password: ${{secrets.SERVER_PASS}}
          script: |
            docker load < ${{env.DEPLOY_DIR_WEBAPP}}-${{github.run_id}}/locene-topos-webapp.tar
            mkdir -p ${{env.DEPLOY_DIR_WEBAPP}}
            mv -f ${{env.DEPLOY_DIR_WEBAPP}}-${{github.run_id}}/deploy/docker-compose.yml ${{env.DEPLOY_DIR_WEBAPP}}/docker-compose.yml
            rm -rf ${{env.DEPLOY_DIR_WEBAPP}}-${{github.run_id}}
            cd ${{env.DEPLOY_DIR_WEBAPP}}
            docker compose down
            docker compose up -d

  cleanup-work:
    needs: [deploy-backend, deploy-webapp]
    runs-on: ubuntu-latest

    steps:
      - name: Prune images
        uses: appleboy/ssh-action@master
        with:
          host: ${{secrets.SERVER_HOST}}
          username: ${{secrets.SERVER_USER}}
          password: ${{secrets.SERVER_PASS}}
          script: |
            docker image prune -f
